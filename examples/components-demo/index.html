<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLui Components Demo</title>
    <link rel="stylesheet" href="/src/main.css" />
  </head>
  <!--
    `bg-surface-muted` / `text-text` / `text-text-muted` used to sit on these two
    elements and compiled to NO CSS — the same dead-token family as `bg-surface-2`.
    They survived because `scripts/test/tailwind-classes.test.ts` read `.ts`
    sources only and never opened this file (issue #251). It does now: the
    `class="…"` attributes below are compiled with the real Tailwind build
    alongside the demo's TypeScript recipes.
  -->
  <body class="bg-background text-foreground">
    <div class="mx-auto max-w-5xl p-6">
      <header class="mb-4">
        <h1 class="text-3xl font-bold">LLui Components</h1>
        <p class="mt-1 text-muted-foreground">
          Headless components styled with the
          <span class="font-mono text-sm">@llui/components/styles</span>
          theme layer. Nine sections compose as modules over one update loop — the signal surface
          has a single update cycle per mounted component, so there is no
          <span class="font-mono text-sm">child()</span> boundary between them.
        </p>
      </header>
      <div id="app"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

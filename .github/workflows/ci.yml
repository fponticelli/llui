name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turbo's background daemon and its telemetry flush both do I/O after a run
  # completes; in the CI container that post-run step hung turbo for 24 min
  # after every task had already finished (all log groups closed, but turbo
  # never returned). Disable both so turbo exits as soon as the tasks do.
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    # Run inside the official Playwright image: Chromium + its OS deps are baked
    # in, so CI never touches cdn.playwright.dev — which was deterministically
    # hanging at 100% on the chromium download and taking the job down (a 3h+
    # runner-killed job, then every retry stalling at the same point). The tag
    # MUST match the playwright version in pnpm-lock.yaml (1.59.1) so the bundled
    # browser revision matches what `playwright` expects — bump both together.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      # tini as PID 1: reaps zombie children and forwards signals. Tests spawn
      # the llui-mcp CLI server; without an init the container leaves killed
      # children unreaped, which kept the last vitest process alive (a 24-min
      # stall until the job timeout). Pairs with the tests' SIGKILL teardown.
      options: --init
    # Backstop against any hung step so a hang fails fast instead of burning CI
    # minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Only this job runs inside a `container:`, and there the checkout is owned
      # by a different uid than the steps run as. actions/checkout papers over
      # that by writing `safe.directory` into a TEMPORARY HOME which is gone by
      # the time the tests run, so anything shelling out to git dies with
      # "fatal: detected dubious ownership" — which took
      # scripts/test/source-encoding.test.ts (`git ls-files`) down on EVERY run,
      # failing CI on main independently of any change. Re-add it to the real
      # HOME so git works for the whole job. The `drift` job needs no equivalent:
      # it runs directly on the runner, where the uids already match.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Persist turbo's local cache (`.turbo/cache`, turbo 2's default dir)
      # across runs so unchanged packages replay from cache instead of
      # rebuilding the world. Keyed on the lockfile + turbo.json so a dep or
      # pipeline change busts it; the commit sha makes each run save a fresh
      # entry, and restore-keys fall back to the newest compatible cache. The
      # key prefix is shared with deploy-docs.yml so both workflows reuse it.
      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-

      - name: Format check
        run: pnpm format:check

      - name: Build
        # Exclude @llui/site: its build runs 4 generators + a Vike prerender +
        # 12 example Vite bundles, and deploy-docs.yml rebuilds it from scratch
        # anyway. The drift job already excludes it identically. Verify only
        # needs the publishable packages built (+ the example apps, which are
        # their OWN packages with their own build task — the smoke step below
        # boots their dist, so they must and do still build here).
        run: pnpm turbo build --filter=!@llui/site

      # Published-tarball invariants that are invisible in-repo: relative imports
      # must carry .js (Node ESM won't guess), sourcemap sources must exist and be
      # in `files`, and no orphaned artifacts of deleted sources.
      - name: Dist integrity
        run: pnpm check:dist

      - name: Type check
        run: pnpm turbo check

      - name: Benchmark tooling type check
        run: pnpm check:benchmarks

      # `turbo check` above runs PER PACKAGE and the repo root is not a workspace
      # member, so before #252 nothing type-checked `scripts/` at all — the
      # `check:benchmarks` config above names an explicit `files` list that
      # reached 26 of the 62 files there, and the guards this repo leans on
      # hardest sat outside it (`registry-attrs`, `tailwind-classes`,
      # `token-contrast`, `chip-contrast` — the checks for dead CSS, wrong
      # `data-*` values and failing contrast, all of which catch defects a green
      # test suite cannot see). Measured: inserting a plain type error into
      # `scripts/test/token-contrast.test.ts` survived `turbo check`,
      # `turbo lint`, `check:benchmarks` AND `format:check`.
      #
      # `checkJs` is on, so the `.mjs` helpers those tests import are checked
      # from the inside too, not merely across the import boundary. That half is
      # the point: the tests index into loosely-typed helper results, and a drift
      # surfaces as a runtime `undefined` inside an assertion — which can pass.
      #
      # It needs no build, and the reason is narrower than "scripts/ imports no
      # package": FOUR files reach into package SOURCES by relative path, in six
      # import statements — `chip-contrast` (x1), `registry-demo-sync` (x2),
      # `lexical-loro-stress-lane` (x2) and `emit-deps` (x1, a type-only
      # `import()` of `@llui/compiler`'s SRC entry, added by #256 in place of a
      # hand-written restatement of two signatures). A fifth,
      # `vitest-config-baseline`, reaches outside `scripts/` but only to the
      # repo-root `vitest.shared.ts`, which is not a package source; count it
      # under "outside scripts/" (5 files / 7 statements) and not under this
      # one.
      #
      # What makes the gate build-independent is that every one of those resolves
      # to a `.ts` SOURCE file: the program contains zero `@llui/*` specifiers and
      # zero `packages/*/dist` artifacts, measured with `--listFiles`. So this step
      # sits here purely to keep the type-check steps together, not because it
      # depends on the build above.
      #
      # It is a TYPE gate and not an `any` ban — `JSON.parse` returns `any` and
      # `scripts/` has ~38 call sites, none of which a tsconfig can reject. The
      # ban is the `Scripts lint` step BELOW (#256, closed): ESLint now runs
      # here, type-aware, with the `no-unsafe-*` family and `no-explicit-any` at
      # error, and zero explicit `any`s survive. (This comment used to claim two
      # did. Only ONE was TypeScript — `a11y-audit.ts`, now typed from
      # axe-core's own declarations. The other, `jfb-trace-start.ts`'s
      # `entries: any[]`, sits inside a TEMPLATE LITERAL: source text this
      # script splices into an upstream JS file, so no gate here has an opinion
      # on it and a grep that counts it is counting a string.)
      - name: Scripts type check
        run: pnpm check:scripts

      # The OTHER half of the same gap (#256). `pnpm turbo lint` below runs the
      # `lint` task PER PACKAGE and the root is not a workspace member, so
      # nothing linted `scripts/` at all — #252 closed the type-check half and
      # left this one open in as many words ("Banning them needs ESLint, which
      # still does not run here").
      #
      # It sits HERE rather than beside `Lint` on purpose: the two `scripts/`
      # gates are one pair, and a reader asking "what covers `scripts/`?" should
      # find both in one place rather than 40 lines apart. Ordering is otherwise
      # free — `verify` fails fast, so a step's position only decides which
      # failure you are shown first.
      #
      # It is TYPE-AWARE over the same `tsconfig.scripts.json` program the step
      # above compiles, which is what makes the `no-unsafe-*` family available
      # for the `.mjs` half too; the rule-set measurements and why
      # `strictTypeChecked` was rejected are in `eslint.config.ts`. Over the 66
      # files the globs match, on an 18-core darwin/arm64 machine: 4.1 s quiet,
      # 4.4 s (median of 3) at load ~210, and 4.8 s at load ~240 in an
      # independent measurement — call it ~4-5 s, and do not read the level as
      # portable to the 4-core CI runner.
      #
      # `--max-warnings=0` in the script: no rule in this block is warn-level
      # today, so it is currently a no-op, but a gate that ignores warnings is
      # the thing this repo says does not work on LLMs or on humans in a hurry.
      - name: Scripts lint
        run: pnpm lint:scripts

      # The registry ships SOURCE that only a consumer's build compiles, so
      # `turbo check` never sees it. This is the same blind spot that let
      # `src/styles/classes/*` accumulate 116 dead Tailwind utilities behind a
      # green suite; the companion check is the compile-the-real-Tailwind test
      # in `Test root scripts` below, which fails on a class that emits no CSS.
      - name: Registry type check
        run: pnpm check:registry

      - name: Lint
        run: pnpm turbo lint

      - name: Test
        # THE DAEMON WAS NOT THE CAUSE. Recorded per the instruction this comment
        # used to carry, because the experiment it proposed has now run and failed.
        #
        # HISTORY: `turbo test` hangs in the GH container for ~24 min AFTER every
        # task has finished — all log groups closed, every suite green, turbo
        # simply never returns. It exits fine locally. The standing hypothesis was
        # turbo's background DAEMON doing I/O after the tasks exit, so the step ran
        # `TURBO_DAEMON=false pnpm turbo test --concurrency=2` to test exactly that.
        #
        # Run 31862751399 (2026-08-15) disproves it. With the daemon off, all 23
        # packages started AND printed their summaries by 03:54:33 — then 23
        # minutes of total silence until the 30-minute job timeout killed it at
        # 04:17:50. Same stall, daemon off. The hypothesis is dead; do not retry it.
        #
        # Why it stayed hidden for months: `turbo.json` lists
        # `$TURBO_ROOT$/vitest.shared.ts` as a `test` input, so almost every run
        # replayed all 42 tasks from the restored cache in seconds and turbo exited
        # before it could hang. The stall only appears when turbo actually EXECUTES
        # the tasks — i.e. the first run after that file changes. Verify was 4–5 min
        # on those cached runs; this one never finished.
        #
        # So: back to `pnpm -r`, which always runs fresh and has no stale-cache
        # risk. The cost is that unchanged packages no longer replay — measured at
        # 52 s for the whole workspace cold on an 18-core machine, so the 30-minute
        # job budget has ample room even on the 4-core runner.
        #
        # --workspace-concurrency=2: each vitest already forks ~ncpu workers, so
        # running many package suites at once oversubscribes the 4-core runner
        # ~10x and starves timer-sensitive tests. Two at a time keeps load gentle.
        run: pnpm -r --workspace-concurrency=2 run test
        # Opts this run into emitting per-file duration reports (#193). It costs
        # nothing — vitest's stock `json` reporter runs alongside the default one
        # — and it means the duration gate below reads the SAME run everyone
        # looks at, rather than a second measurement pass that could drift from
        # it.
        env:
          # RELATIVE on purpose, and it must stay that way: this job runs inside a
          # `container:`, where the workspace is mounted at /__w/<repo>/<repo> but
          # `github.workspace` still expands to the HOST path
          # (/home/runner/work/...). That absolute value named a directory that
          # does not exist in the container, so the reports went one place and the
          # reader looked in another. Both sides resolve a relative value against
          # the repo root (`vitest.shared.ts`, `scripts/check-test-durations.mjs`).
          LLUI_TEST_DURATIONS: .test-durations

      # The slow-test signal that replaced the 5 s timeout canary (#193). Reads
      # the reports the step above just wrote (`--no-run`) and diffs per-file
      # durations against the committed baseline AFTER dividing out a same-run
      # load factor, so a slower runner reports nothing while a single file that
      # got 6x slower still does.
      #
      # REPORT-ONLY ON PURPOSE, and enforced by `continue-on-error` rather than by
      # the absence of `--gate`. Omitting `--gate` only suppresses the REGRESSION
      # verdict; the script still exits 1 when it finds no reports, cannot read the
      # baseline, or aborts on load — and the first of those failed this job on the
      # very first run, under a comment asserting it could not. A step whose whole
      # contract is "cannot fail the job" has to say so in the one place the runner
      # actually reads.
      #
      # An earlier revision DID gate, and it reddened on unchanged code: the
      # committed baseline had been recorded on a loaded machine, so de-scaling
      # inflated a file whose cost does not track load and reported a 3.33x
      # "regression" that was not one. This runner also compares linux/x64
      # against a darwin/arm64 baseline, where that mismatch is larger, and no
      # amount of local testing can prove that cross-platform comparison stable.
      # Print the numbers, let a few main-branch runs establish whether they are
      # trustworthy, and add `--gate` then — not before.
      #
      # `if: always()` so a failing suite still leaves the duration verdict
      # visible instead of hiding it behind the first red step.
      - name: Test durations (report only)
        if: always()
        continue-on-error: true
        run: pnpm check:test-durations --no-run
        env:
          # RELATIVE on purpose, and it must stay that way: this job runs inside a
          # `container:`, where the workspace is mounted at /__w/<repo>/<repo> but
          # `github.workspace` still expands to the HOST path
          # (/home/runner/work/...). That absolute value named a directory that
          # does not exist in the container, so the reports went one place and the
          # reader looked in another. Both sides resolve a relative value against
          # the repo root (`vitest.shared.ts`, `scripts/check-test-durations.mjs`).
          LLUI_TEST_DURATIONS: .test-durations

      # Root `scripts/` belongs to no workspace package, so `turbo test` above
      # cannot see it — these tests run under their own vitest config and would
      # otherwise execute only in `pnpm verify`, which CI does not call. A gate
      # that never runs is not a gate: `scripts/lib/verify-install.ts` is what
      # stops `bench:setup` from reporting success over an incomplete install
      # (#81), so it has to be checked here.
      - name: Test root scripts
        run: pnpm test:scripts

      # Boot every built example in headless Chromium and fail on any
      # console.error / page error. Catches issue-#5-class bugs where
      # the bundle compiles cleanly but crashes on first paint
      # (missing __view, broken __prefixes, etc.) — the kind of fault
      # type-checks and unit tests can't surface. Uses the browser
      # pre-installed in the container image (PLAYWRIGHT_BROWSERS_PATH).
      - name: Smoke-test example bundles
        run: pnpm smoke:examples

  # Drift gate: the API reference and example pages under site/content are
  # GENERATED (see site/src/generate-*.ts) and committed. If a source change
  # (a JSDoc edit, a new export, a new package in the registry, an example
  # tweak) isn't accompanied by a regenerate, the committed pages silently go
  # stale. This job regenerates them and fails if the working tree changes —
  # forcing the generated output to be committed alongside its source.
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-

      # The generators read each package's built types, so build first (replays
      # from the shared turbo cache when unchanged).
      - name: Build packages
        run: pnpm turbo build --filter=!@llui/site

      # Regenerates, then diffs ALL of site/ — from a clean checkout anything that
      # moved is generated output by definition, so this also catches a generator
      # growing a new output that the (narrower) local check doesn't know about.
      - name: Fail on drift in generated pages
        run: pnpm check:generated -- --strict
